# ==============================================================================
# Cisco Switch
# ==============================================================================
#
# Modul pro běžné monitorování Cisco IOS switchů.
#
# Testováno:
#
#   ✔ Catalyst 2960
#   ✔ Catalyst 3560
#   ✔ Catalyst 3750
#   ✔ Catalyst 3850
#
# Modul obsahuje:
#
#   • systém
#   • uptime
#   • hostname
#   • interface
#   • traffic
#   • errors
#   • discards
#   • duplex
#   • speed
#
# Neobsahuje:
#
#   • PoE
#   • CPU
#   • Memory
#
# Ty jsou v samostatných souborech.
#
# ==============================================================================