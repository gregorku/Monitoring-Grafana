```yaml
###############################################################################
#
# Monitoring-Grafana
#
# File:
#   configs/traefik/dynamic/vault.yml
#
# Description:
#   Test route from the central Traefik to HashiCorp Vault
#   running in a separate Incus container.
#
# Vault:
#   Incus IP: 10.10.10.11
#   HTTP port: 8200
#
# Public hostname:
#   vault.serveftp.org
#
###############################################################################

http:

  ###########################################################################
  # Router
  ###########################################################################

  routers:

    vault:

      entryPoints:
        - websecure

      rule: "Host(`vault.serveftp.org`)"

      service: vault

      tls:
        certResolver: letsencrypt


  ###########################################################################
  # Service
  ###########################################################################

  services:

    vault:

      loadBalancer:

        passHostHeader: true

        servers:

          - url: "http://10.10.10.11:8200"
```
