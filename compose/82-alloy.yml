###############################################################################
# Grafana Alloy - Docker log collector
###############################################################################
services:

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    container_name: alloy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DATA_DIR}/alloy/data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:12345/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      bridge-moje:
        ipv4_address: ${IP_ALLOY}
